<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quét tick đơn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f8;--ink:#14213d;--mut:#5d6b82;--line:#d9e0ea;--ok:#0e9f6e;--dup:#e8a317;--none:#d64545;--cho:#3b6ea8;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0e1622;--ink:#e8edf5;--mut:#92a0b5;--line:#243244}}
*{box-sizing:border-box}
body{margin:0 auto;max-width:520px;background:var(--bg);color:var(--ink);font:500 16px/1.4 "Be Vietnam Pro",system-ui,sans-serif;padding:max(12px,env(safe-area-inset-top)) 14px max(16px,env(safe-area-inset-bottom))}
#cam{border-radius:18px;overflow:hidden;background:#0b1220;min-height:220px;display:grid;place-items:center;color:#8fa0b8}
#cam.on::before{content:none}
#cam::before{content:"Camera đang tắt"}
#reader{width:100%}
#reader video{width:100%!important;display:block}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 16px;background:var(--ink);color:var(--bg)}
.hang{display:flex;gap:8px;margin-top:10px}
.hang button{flex:1}
#anh2,#url2{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.tuychon{display:flex;gap:10px;align-items:center;margin:12px 2px;font-size:15px}
.tuychon input{width:20px;height:20px;flex:none}
.lsh span{display:flex;gap:6px}
.lsh{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.lsh button{padding:6px 12px;font-size:14px;background:transparent;color:var(--mut);border:1px solid var(--line)}
#ds small{display:block;color:var(--mut);font-size:12px}
#kq{margin-top:10px;border-radius:18px;padding:18px;min-height:112px;display:flex;flex-direction:column;justify-content:center;gap:2px;background:var(--line);color:var(--ink);transition:background .15s}
#kq.ok{background:var(--ok);color:#fff}
#kq.dup{background:var(--dup);color:#2b1d00}
#kq.none{background:var(--none);color:#fff}
#kq.cho{background:var(--cho);color:#fff}
#kqT{font-size:28px;line-height:1.15}
#kqM{font-size:15px;word-break:break-all;opacity:.9}
.cnt{display:flex;justify-content:space-between;margin:12px 2px;color:var(--mut);font-size:14px}
.cnt b{color:var(--ink);font-size:17px}
.tay{display:flex;gap:8px}
.tay input{flex:1;min-width:0;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink)}
#ds{list-style:none;margin:12px 0 0;padding:0}
#ds li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
#ds span{word-break:break-all}
#ds .ok b{color:var(--ok)}#ds .dup b{color:var(--dup)}#ds .none b{color:var(--none)}
#ds b{white-space:nowrap}
#ds .cho b{color:var(--cho)}
#ds .loi b{color:var(--none)}
#hang{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;padding:10px 14px;border-radius:14px;background:var(--line)}
#hang[hidden]{display:none}
#hang button{padding:8px 12px;font-size:14px}
</style>
</head>
<body>
<div id="cam"><div id="reader"></div></div>
<div class="hang"><button id="bt">Bật camera</button><button id="anh2">Quét từ ảnh</button></div>
<div class="hang"><button id="url2">Quét từ link (ảnh / trang web)</button></div>
<input id="anh" type="file" accept="image/*" multiple hidden>
<div id="kq"><b id="kqT">Sẵn sàng quét</b><span id="kqM">Bật camera rồi đưa mã vạch vào khung</span></div>
<div id="hang" hidden><span id="hangT"></span><button id="hangB">Gửi lại ngay</button></div>
<div class="cnt"><span>Đã tick <b id="nok">0</b></span><span>Trùng <b id="ndup">0</b></span><span>Không có <b id="nnone">0</b></span></div>
<label class="tuychon"><input type="checkbox" id="cb"> Tự sao chép mã vào clipboard ngay khi quét</label>
<div class="tay"><input id="tay" placeholder="Nhập mã bằng tay" autocomplete="off"><button id="gui">Gửi</button></div>
<div class="lsh"><b>Lịch sử quét</b><span><button id="rs">Đổi mật khẩu</button><button id="xoa">Xóa lịch sử</button></span></div>
<ul id="ds"></ul>
<div id="tmp" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@2.2.3/dist/iife/reader/index.js"></script>
<script>
let URL_WEB = 'https://script.google.com/macros/s/AKfycbxDILCWk7xPUmNpPj-_Y3sMvhd88xGMGnUay18THVsPFDQ_b8Sw3115_rie5n6706Su/exec'; // link Apps Script dạng https://script.google.com/macros/s/.../exec
const $ = id => document.getElementById(id);
let key = ''; try { key = localStorage.getItem('key') || ''; } catch (e) {}
const cool = {};
let ls = []; try { ls = JSON.parse(localStorage.getItem('ls') || '[]'); } catch (e) {}
const NHAN = {ok:'Đã tick', dup:'Đã quét rồi', none:'Không có trong sheet', cho:'Chờ gửi', loi:'Lỗi'};
const AM = {ok:[880,1], dup:[440,2], none:[180,1], cho:[600,1]};
let ac, sc, wl, chay = false;

function am(s) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume();
    let t = ac.currentTime;
    for (let i = 0; i < AM[s][1]; i++) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = AM[s][0]; g.gain.value = .25; o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + .14); t += .2;
    }
    if (navigator.vibrate) navigator.vibrate(s === 'ok' ? 60 : [120, 60, 120]);
  } catch (e) {}
}
function hien(s, t, m) {
  $('kq').className = s; $('kqT').textContent = t; $('kqM').textContent = m || '';
  if (AM[s]) am(s);
}
function gio(t) {
  const d = new Date(t), p = n => String(n).padStart(2, '0');
  return p(d.getHours()) + ':' + p(d.getMinutes()) + ' ' + p(d.getDate()) + '/' + p(d.getMonth() + 1);
}
function ve() {
  const c = {ok:0, dup:0, none:0, cho:0};
  ls.forEach(x => c[x.s]++);
  ['ok', 'dup', 'none'].forEach(k => $('n' + k).textContent = c[k]);
  $('hang').hidden = !c.cho; $('hangT').textContent = c.cho + ' mã đang chờ gửi';
  const ds = $('ds'); ds.textContent = '';
  ls.slice(0, 100).forEach(x => {
    const li = document.createElement('li'), a = document.createElement('span'), m = document.createElement('small'), b = document.createElement('b');
    li.className = x.s; a.textContent = x.c; m.textContent = gio(x.t) + (x.r ? ' (dòng ' + x.r + ')' : ''); b.textContent = NHAN[x.s];
    a.append(m); li.append(a, b); ds.append(li);
  });
}
function hoiKey() {
  const k = prompt('Nhập mật khẩu đã đặt trong Apps Script');
  if (!k) return false;
  key = k.trim(); try { localStorage.setItem('key', key); } catch (e) {}
  return true;
}
function hoiUrl() {
  const u = prompt('Dán link Apps Script (kết thúc bằng /exec)');
  if (!u) return false;
  const v = u.trim();
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(v)) { alert('Link chưa đúng. Phải bắt đầu bằng https://script.google.com/ và kết thúc bằng /exec'); return false; }
  URL_WEB = v; try { localStorage.setItem('url', URL_WEB); } catch (e) {}
  return true;
}
async function chep(t) { try { await navigator.clipboard.writeText(t); return true; } catch (e) { return false; } }
function luuLs() {
  ls = ls.filter((x, i) => i < 500 || x.s === 'cho');
  try { localStorage.setItem('ls', JSON.stringify(ls)); } catch (e) {}
}
async function goi(code, t) {
  const ab = new AbortController(), tm = setTimeout(() => ab.abort(), 12000);
  try {
    const r = await fetch(URL_WEB, {method:'POST', body:JSON.stringify({code, key, t}), signal:ab.signal});
    return await r.json();
  } finally { clearTimeout(tm); }
}
let dangGui = false;
async function guiHang() {
  if (dangGui || !navigator.onLine || !URL_WEB || !key || !ls.some(y => y.s === 'cho' && !bay.has(y))) return;
  dangGui = true;
  try {
    for (const x of ls.filter(y => y.s === 'cho' && !bay.has(y)).reverse()) {
      const d = await goi(x.c, x.t);
      if (d.s === 'ok' || d.s === 'dup' || d.s === 'none') { x.s = d.s; x.r = d.row; luuLs(); ve(); }
      else { if (d.s === 'auth') { key = ''; try { localStorage.removeItem('key'); } catch (e) {} } break; }
    }
  } catch (e) {} finally { dangGui = false; }
}
const bay = new WeakSet();
async function gui(code, force, mot) {
  code = String(code).trim();
  if (!code || (!URL_WEB && !hoiUrl()) || (!key && !hoiKey())) return null;
  const now = Date.now();
  if (force !== true && cool[code] && now - cool[code] < 4000) return null;
  cool[code] = now;
  const cb = ((force !== true || mot === true) && $('cb').checked) ? await Promise.race([chep(code), new Promise(r => setTimeout(() => r(false), 800))]) : null;
  const cp = cb === null ? '' : cb ? ' – đã sao chép' : ' – không sao chép được';
  const it = {c:code, s:'cho', t:now};            // lưu trước khi gửi để lỡ tắt tab cũng không mất
  ls.unshift(it); bay.add(it); luuLs(); ve();
  hien('wait', 'Đang gửi…', code + cp);
  let d;
  try { d = await goi(code, now); }
  catch (e) {
    bay.delete(it);
    hien('cho', 'Đã lưu, chờ gửi', code + cp + (e instanceof SyntaxError ? ' (Apps Script không trả dữ liệu: kiểm tra triển khai Bất kỳ ai, link /exec)' : ' (chưa có mạng, sẽ tự gửi lại)'));
    return 'cho';
  }
  bay.delete(it);
  if (d.s === 'ok' || d.s === 'dup' || d.s === 'none') {
    it.s = d.s; it.r = d.row; luuLs(); ve();
    hien(d.s, NHAN[d.s], (d.s === 'none' ? code : code + ' (dòng ' + d.row + ')') + cp);
    guiHang();
    return d.s;
  }
  if (d.s === 'auth') {
    key = ''; try { localStorage.removeItem('key'); } catch (e) {}
    hien('none', 'Sai mật khẩu', 'Mã đã lưu chờ gửi. Bấm Đổi mật khẩu để nhập lại');
  } else { it.s = 'loi'; luuLs(); ve(); hien('none', 'Lỗi', d.msg || ''); }
  return 'loi';
}

$('bt').onclick = async () => {
  if (chay) {
    try { await sc.stop(); } catch (e) {}
    chay = false; $('cam').classList.remove('on'); $('bt').textContent = 'Bật camera';
    try { wl && wl.release(); } catch (e) {}
    return;
  }
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) {}
  if (!key && !hoiKey()) return;
  try {
    const F = Html5QrcodeSupportedFormats;
    sc = sc || new Html5Qrcode('reader', {verbose:false, formatsToSupport:[F.QR_CODE, F.CODE_128, F.CODE_39, F.EAN_13, F.EAN_8, F.UPC_A, F.ITF]});
    await sc.start({facingMode:'environment'},
      {fps:10, qrbox:(w, h) => { const b = Math.floor(w * .9); return {width:b, height:Math.floor(Math.min(h * .8, b * .55))}; }},
      gui, () => {});
    chay = true; $('cam').classList.add('on'); $('bt').textContent = 'Tắt camera';
    try { wl = await navigator.wakeLock.request('screen'); } catch (e) {}
  } catch (e) {
    hien('none', 'Không bật được camera', 'Cho phép camera cho trang này, và mở trang bằng https');
  }
};
$('gui').onclick = () => { const v = $('tay').value; $('tay').value = ''; gui(v); };
$('tay').addEventListener('keydown', e => { if (e.key === 'Enter') $('gui').click(); });

let fs;
function layFs() {
  const F = Html5QrcodeSupportedFormats;
  return fs = fs || new Html5Qrcode('tmp', {verbose:false, formatsToSupport:[F.QR_CODE, F.CODE_128, F.CODE_39, F.EAN_13, F.EAN_8, F.UPC_A, F.ITF]});
}
async function docAnh(f) {
  let bm = null;
  try { bm = await createImageBitmap(f); } catch (e) {}
  if (!bm) throw 'FORMAT';
  const lon = Math.max(bm.width, bm.height), bl = [];
  for (const t of [...new Set([1600, 1000, 640].map(x => Math.min(x, lon)))]) {
    const k = t / lon, c = document.createElement('canvas');
    c.width = Math.round(bm.width * k); c.height = Math.round(bm.height * k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    g.drawImage(bm, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    bl.push(blob);
    try { return await fs.scanFile(new File([blob], 'a.png', {type:'image/png'}), false); } catch (e) {}
  }
  if (window.ZXingWASM) {
    for (const b of [f, bl[0]]) {
      try {
        const rs = (await ZXingWASM.readBarcodes(b, {tryHarder:true, maxNumberOfSymbols:6, formats:['Code128','QRCode','Code39','EAN13','ITF']})).filter(x => x.text);
        if (rs.length) return (rs.find(x => /128/.test(x.format)) || rs[0]).text;
      } catch (e) {}
    }
  }
  throw 'KHONG ' + bm.width + 'x' + bm.height;
}
const nghi = ms => new Promise(r => setTimeout(r, ms));
$('anh2').onclick = () => $('anh').click();
$('anh').onchange = async e => {
  const fl = [...e.target.files]; e.target.value = '';
  if (!fl.length || (!key && !hoiKey())) return;
  layFs();
  let ok = 0, hong = 0;
  for (let i = 0; i < fl.length; i++) {
    hien('wait', 'Đang đọc ảnh ' + (i + 1) + '/' + fl.length, fl[i].name);
    let code;
    try { code = await docAnh(fl[i]); }
    catch (err) { hong++; hien('none', 'Không đọc được mã', (err === 'FORMAT' ? 'Trình duyệt không mở được định dạng ảnh này: ' : 'Ảnh ' + (i + 1) + ': ') + fl[i].name + (String(err).startsWith('KHONG') ? ' (' + String(err).slice(6) + ')' : '')); await nghi(1500); continue; }
    const s = await gui(code, true, fl.length === 1);
    if (s && s !== 'loi') ok++; else hong++;
    await nghi(500);
  }
  hien('wait', 'Xong ' + fl.length + ' ảnh', 'Đã gửi ' + ok + ' mã, lỗi ' + hong);
};
function chuanHoa(u) {
  const m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/) || u.match(/drive\.google\.com\/(?:open|uc)\?(?:[^#]*&)?id=([\w-]+)/);
  return m ? 'https://drive.google.com/uc?export=download&id=' + m[1] : u;
}
async function layAnhUrl(u) {
  try {                                   // lớp 1: tải thẳng (cần server ảnh cho phép CORS)
    const r = await fetch(u, {mode:'cors'});
    if (!r.ok) throw 0;
    return await r.blob();
  } catch (e) {}
  const ab = new AbortController(), tm = setTimeout(() => ab.abort(), 25000);
  try {                                   // lớp 2: nhờ Apps Script tải hộ
    const r = await fetch(URL_WEB + '?act=img&key=' + encodeURIComponent(key) + '&url=' + encodeURIComponent(u), {signal:ab.signal});
    const d = await r.json();
    if (d.s === 'auth') { key = ''; try { localStorage.removeItem('key'); } catch (e) {} throw 'AUTH'; }
    if (d.s === 'loi' && d.code) throw 'HTTP ' + d.code;
    if (d.s !== 'img' || !d.b64) throw 'PROXY';
    const bin = atob(d.b64), a = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return new Blob([a], {type:d.mime || 'image/png'});
  } finally { clearTimeout(tm); }
}
function anhTuHtml(html, base) {
  const doc = new DOMParser().parseFromString(html, 'text/html'), out = [];
  const them = v => {
    if (!v) return;
    try {
      const u = new URL(v.trim(), base).href;
      if (/^https?:/i.test(u) && !/\.svg(\?|$)/i.test(u) && !out.includes(u)) out.push(u);
    } catch (e) {}
  };
  doc.querySelectorAll('meta[property="og:image"],meta[name="twitter:image"]').forEach(m => them(m.content));
  doc.querySelectorAll('img').forEach(i => {
    ['src', 'data-src', 'data-original', 'data-lazy-src'].forEach(k => them(i.getAttribute(k)));
    const ss = i.getAttribute('srcset');
    if (ss) { const l = ss.split(',').map(x => x.trim().split(/\s+/)[0]); them(l[l.length - 1]); }
  });
  return out.slice(0, 15);
}
$('url2').onclick = async () => {
  if ((!URL_WEB && !hoiUrl()) || (!key && !hoiKey())) return;
  const u = chuanHoa((prompt('Dán link ảnh hoặc link trang web chứa ảnh (https://...)') || '').trim());
  if (!u) return;
  if (!/^https?:\/\//i.test(u)) { hien('none', 'Link chưa đúng', 'Link phải bắt đầu bằng http:// hoặc https://'); return; }
  hien('wait', 'Đang tải link…', u);
  let blob;
  try { blob = await layAnhUrl(u); }
  catch (e) {
    hien('none', e === 'AUTH' ? 'Sai mật khẩu' : 'Không tải được link',
      e === 'AUTH' ? 'Bấm Đổi mật khẩu để nhập lại' : (typeof e === 'string' && e.startsWith('HTTP')) ? 'Server của link trả về lỗi ' + e.slice(5) + ' (link riêng tư hoặc chặn máy chủ Google)' : 'Server chặn truy cập, hoặc Apps Script chưa có đoạn xử lý link');
    return;
  }
  layFs();
  let code = null;
  if (/html/i.test(blob.type)) {                       // link là trang web: tìm các ảnh trong trang rồi thử từng ảnh
    const ds = anhTuHtml(await blob.text(), u);
    if (!ds.length) { hien('none', 'Trang không có ảnh', 'Không thấy thẻ ảnh nào trong trang (trang có thể tải ảnh bằng JavaScript)'); return; }
    for (let i = 0; i < ds.length && !code; i++) {
      hien('wait', 'Đang thử ảnh ' + (i + 1) + '/' + ds.length, ds[i]);
      try { code = await docAnh(await layAnhUrl(ds[i])); } catch (e) { if (e === 'AUTH') break; }
    }
    if (!code) { hien('none', 'Không tìm thấy mã', 'Đã thử ' + ds.length + ' ảnh trong trang nhưng không đọc được mã vạch'); return; }
  } else {                                             // link là ảnh
    try { code = await docAnh(blob); }
    catch (err) { hien('none', 'Không đọc được mã', err === 'FORMAT' ? 'Link không phải ảnh hoặc định dạng không hỗ trợ' : 'Không tìm thấy mã vạch trong ảnh'); return; }
  }
  await gui(code, true, true);
};
$('xoa').onclick = () => {
  if (!confirm('Xóa toàn bộ lịch sử quét trên máy này? (Ô đã tick, lịch sử trong sheet và các mã đang chờ gửi vẫn được giữ)')) return;
  ls = ls.filter(x => x.s === 'cho'); luuLs(); ve();
};
try { $('cb').checked = localStorage.getItem('cb') === '1'; } catch (e) {}
$('cb').onchange = () => { try { localStorage.setItem('cb', $('cb').checked ? '1' : '0'); } catch (e) {} };
$('rs').onclick = () => {
  try { localStorage.removeItem('key'); } catch (e) {}
  key = ''; hoiKey();
};
$('hangB').onclick = async () => {
  if ((!URL_WEB && !hoiUrl()) || (!key && !hoiKey())) return;
  await guiHang();
  const n = ls.filter(x => x.s === 'cho').length;
  if (n) hien('none', 'Chưa gửi được', 'Còn ' + n + ' mã chờ. Kiểm tra mạng hoặc link Apps Script');
};
window.addEventListener('online', guiHang);
document.addEventListener('visibilitychange', () => { if (!document.hidden) guiHang(); });
setInterval(guiHang, 15000);
ve(); guiHang();
</script>
</body>
</html>
